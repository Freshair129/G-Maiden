name: PR Gate Agent

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  checks: read
  pull-requests: write

jobs:
  pr-gate-agent:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    name: pr-gate-agent
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PR gate agent unit tests
        run: node --test tools/pr-gate-agent/*.test.mjs

      - name: Wait for required CI check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # CI includes a cold Tauri native build and can exceed ten minutes.
          # Keep the gate polling, but give the required check a 60-minute
          # budget so a slow successful CI run is not reported as a false fail.
          max_attempts=240
          poll_seconds=15
          for attempt in $(seq 1 "${max_attempts}"); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "ci")][0].status // "missing"')
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "ci")][0].conclusion // "unknown"')

            echo "required ci check: status=${status} conclusion=${conclusion} attempt=${attempt}/${max_attempts}"

            if [[ "${status}" == "completed" ]]; then
              if [[ "${conclusion}" == "success" ]]; then
                exit 0
              fi
              echo "Required CI check completed with conclusion=${conclusion}." >&2
              exit 1
            fi

            sleep "${poll_seconds}"
          done

          echo "Timed out waiting for required CI check." >&2
          exit 1

      - name: Evaluate PR gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_GATE_AGENT_REVIEW_TOKEN: ${{ secrets.PR_GATE_AGENT_REVIEW_TOKEN }}
        run: node tools/pr-gate-agent/run.mjs

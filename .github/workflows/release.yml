name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C src install --frozen-lockfile

      - name: Stage GPU feeder
        run: node src-tauri/scripts/stage-gpu-feeder.mjs

      - name: Assert tagged SHA matches workflow SHA
        shell: pwsh
        run: |
          $headSha = (git rev-parse HEAD).Trim()
          $tagSha = (git rev-list -n 1 "${{ github.ref_name }}").Trim()
          if ($headSha -ne "${{ github.sha }}") {
            throw "workflow sha mismatch: head=$headSha workflow=${{ github.sha }}"
          }
          if ($tagSha -ne $headSha) {
            throw "tag ${{ github.ref_name }} points to $tagSha, expected $headSha"
          }

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Frontend lint
        run: pnpm -C src exec eslint .

      - name: Frontend types
        run: pnpm -C src exec tsc --noEmit

      - name: Frontend tests
        run: pnpm -C src test -- --run

      - name: Tauri smoke build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Compile Rust + build the frontend to catch build breaks, but skip
          # bundling the installers/updater — that step signs the updater
          # artifact and needs TAURI_SIGNING_PRIVATE_KEY, which only the
          # publishing `release` job below carries. A sign-less smoke build.
          # `-- --locked` forwards to the underlying cargo invocation (see
          # `tauri build --help`: ARGS after `--` pass through to the runner).
          args: --no-bundle -- --locked

  release:
    needs: verify
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C src install --frozen-lockfile

      - name: Stage GPU feeder
        run: node src-tauri/scripts/stage-gpu-feeder.mjs

      - name: Re-assert tagged SHA lineage
        shell: pwsh
        run: |
          $headSha = (git rev-parse HEAD).Trim()
          $tagSha = (git rev-list -n 1 "${{ github.ref_name }}").Trim()
          if ($headSha -ne "${{ github.sha }}") {
            throw "workflow sha mismatch: head=$headSha workflow=${{ github.sha }}"
          }
          if ($tagSha -ne $headSha) {
            throw "tag ${{ github.ref_name }} points to $tagSha, expected $headSha"
          }

      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "G-Maiden ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: false
          prerelease: false
          args: -- --locked

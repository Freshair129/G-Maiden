name: release

# Build, sign, and publish a GitHub Release whenever you push a version tag
# (e.g. `git tag v0.2.0 && git push origin v0.2.0`). The release includes the
# NSIS/MSI installers, the signed updater artifacts, and `latest.json` — which
# the in-app updater reads from
#   https://github.com/Freshair129/G-Maiden/releases/latest/download/latest.json
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of .tauri/g-maiden-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the key password ("" if none)
# GITHUB_TOKEN is provided automatically.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager" (pnpm@9.0.0)

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # no cache: pnpm-lock.yaml is gitignored in this repo

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          pnpm install
          pnpm -C src install

      - name: Build, sign, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'G-Maiden ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: false
          prerelease: false

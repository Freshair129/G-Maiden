name: promote-release

on:
  workflow_dispatch:
    inputs:
      candidate_manifest:
        description: Path to validated candidate manifest
        required: true
        default: release/channels/dev.json
      approval_file:
        description: Path to approval evidence JSON
        required: true
      dry_run:
        description: Validate without committing Stable manifest
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate candidate and current Stable
        run: |
          node scripts/releases/channel-manifest.mjs validate "${{ inputs.candidate_manifest }}"
          node scripts/releases/channel-manifest.mjs validate release/channels/stable.json
      - name: Promote same artifact metadata
        run: node scripts/releases/channel-manifest.mjs promote "${{ inputs.candidate_manifest }}" release/channels/stable.json "${{ inputs.approval_file }}"
      - name: Prove no artifact identity changed
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('${{ inputs.candidate_manifest }}'));
          const s=JSON.parse(fs.readFileSync('release/channels/stable.json'));
          if (JSON.stringify(c.artifacts)!==JSON.stringify(s.artifacts)) throw new Error('artifact set changed during promotion');
          if (c.sourceSha!==s.sourceSha || c.version!==s.version) throw new Error('source/version changed during promotion');
          NODE
      - name: Commit audited Stable pointer
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release/channels/stable.json
          git commit -m "release: promote $(node -p \"require('./release/channels/stable.json').version\") to stable"
          git push

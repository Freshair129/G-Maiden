name: promote-release

on:
  workflow_dispatch:
    inputs:
      candidate_manifest:
        description: Path to validated candidate manifest
        required: true
        default: release/channels/dev.json
      approval_file:
        description: Path to approval evidence JSON
        required: true
      dry_run:
        description: Validate without committing Stable manifest
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate candidate and current Stable
        run: |
          node scripts/releases/channel-manifest.mjs validate-published "${{ inputs.candidate_manifest }}"
          node scripts/releases/channel-manifest.mjs validate release/channels/stable.json
      - name: Promote same artifact metadata
        run: node scripts/releases/channel-manifest.mjs promote "${{ inputs.candidate_manifest }}" release/channels/stable.json "${{ inputs.approval_file }}"
      - name: Prove no artifact identity changed
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('${{ inputs.candidate_manifest }}'));
          const s=JSON.parse(fs.readFileSync('release/channels/stable.json'));
          if (JSON.stringify(c.platforms)!==JSON.stringify(s.platforms)) throw new Error('artifact set changed during promotion');
          if (c.sourceSha!==s.sourceSha || c.version!==s.version) throw new Error('source/version changed during promotion');
          NODE
      - name: Open audited Stable pointer PR
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="release/stable-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release/channels/stable.json
          version=$(node -p "require('./release/channels/stable.json').version")
          git commit -m "release: promote $version to stable"
          git push --set-upstream origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "release: promote $version to stable" --body "Promotes the approved signed candidate without rebuilding. Review the production approval, source SHA, and unchanged platform URLs, hashes and signatures before merging."

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Fix: setup-node BEFORE pnpm/action-setup so cache key is available
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        # version read from packageManager field in package.json

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      # Fix: rust-cache must scope to src-tauri where Cargo.toml lives
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          pnpm install
          pnpm -C src install

      # The gpu-feeder sidecar is bundled via tauri.conf externalBin, which
      # tauri-build validates at *any* cargo invocation (clippy included). The
      # built binary is gitignored, so stage it before cargo runs.
      - name: Stage gpu-feeder sidecar
        run: node src-tauri/scripts/stage-gpu-feeder.mjs

      # Fix: cargo clippy directly — not via pnpm exec (clippy is not a Node package)
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: ESLint
        run: pnpm -C src lint

      - name: Tauri build (smoke check)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing keys optional in CI — skip if not set
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ''
          releaseName: ''
          releaseDraft: true
          prerelease: true

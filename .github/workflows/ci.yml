name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  party:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/g-party
      - name: Party relay HTTP integration tests
        run: timeout 120 node --test services/g-party-relay/server.test.mjs services/g-party-relay/social.test.mjs
      - name: Party portable client tests
        run: timeout 900 cargo test --manifest-path src-tauri/g-party/Cargo.toml --locked
      - name: Party portable client lint
        run: timeout 900 cargo clippy --manifest-path src-tauri/g-party/Cargo.toml --all-targets --locked -- -D warnings

  social:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOCIAL_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55438/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.0
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/g-party
      - name: Provision disposable PostgreSQL and pgTAP
        run: |
          timeout 180 sudo apt-get update
          timeout 180 sudo apt-get install -y postgresql-16 postgresql-16-pgtap
          pgbin=/usr/lib/postgresql/16/bin
          "$pgbin/initdb" -D "$RUNNER_TEMP/g-party-pg" -U postgres --auth=trust --encoding=UTF8 --locale=C
          "$pgbin/pg_ctl" -D "$RUNNER_TEMP/g-party-pg" -w -t 30 -l "$RUNNER_TEMP/g-party-pg.log" -o "-h 127.0.0.1 -p 55438 -k $RUNNER_TEMP" start
          echo "$pgbin" >> "$GITHUB_PATH"
      - name: Social migration, privilege, transaction and HTTP integration tests
        run: timeout 900 node tools/social-tests/run.mjs --native-boundary
      - name: Social broker and existing IAM tests
        run: timeout 120 deno test --no-lock --node-modules-dir=none --allow-env supabase/functions/_shared/social.test.ts supabase/functions/_shared/social_crypto.test.ts supabase/functions/_shared/iam.test.ts supabase/functions/_shared/iam_security.test.ts
      - name: Stop disposable PostgreSQL
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/g-party-pg/postmaster.pid" ]; then
            /usr/lib/postgresql/16/bin/pg_ctl -D "$RUNNER_TEMP/g-party-pg" -w -t 30 -m fast stop
          fi

  ci:
    needs: [party, social]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # pnpm is installed in the next step, so setup-node must not auto-cache it.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Install pinned pnpm
        shell: pwsh
        run: |
          $pnpmPackage = (Get-Content package.json -Raw | ConvertFrom-Json).packageManager
          $pnpmDir = Join-Path $env:RUNNER_TEMP 'g-maiden-pnpm'
          npm install --prefix $pnpmDir $pnpmPackage --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pnpmBin = Join-Path $pnpmDir 'node_modules/.bin'
          Add-Content -Path $env:GITHUB_PATH -Value $pnpmBin
          & (Join-Path $pnpmBin 'pnpm.cmd') --version

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      # Fix: rust-cache must scope to src-tauri where Cargo.toml lives
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C src install --frozen-lockfile

      - name: Release manifest and packaged updater regression tests
        run: node --test scripts/releases/channel-manifest.test.mjs

      # Doc-graph gate (G1-G3 tooling), one entry point: unit suite +
      # strict scan + G2.5 checklist-exception rule + feature-ledger clean.
      # Runs first: pure node, <30s, catches doc/claim drift before any
      # cargo work.
      - name: Doc-graph gate (tests + strict scan + checklist + ledger)
        run: node tools/doc-graph/ci-gate.mjs

      # Static gameplay snapshots must keep their provenance manifest, runtime
      # schema, and generated hero abilities aligned before Rust embeds them.
      - name: Static gameplay data provenance gate
        run: |
          python tools/data-provenance/verify_manifest.py
          python -m unittest discover -s tools/data-provenance -v

      # The gpu-feeder sidecar is bundled via tauri.conf externalBin, which
      # tauri-build validates at *any* cargo invocation (clippy included). The
      # built binary is gitignored, so stage it before cargo runs.
      - name: Stage gpu-feeder sidecar
        run: node src-tauri/scripts/stage-gpu-feeder.mjs

      - name: Build pinned native MSVC video decoder
        shell: pwsh
        run: ./scripts/setup-native-vpx.ps1

      # Fix: cargo clippy directly — not via pnpm exec (clippy is not a Node package)
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: ESLint
        run: pnpm -C src lint --max-warnings=0

      - name: Rust tests
        run: |
          cargo test --manifest-path src-tauri/gann-package/Cargo.toml --locked
          cargo test --manifest-path src-tauri/native-vpx/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Frontend tests
        run: pnpm -C src test

      - name: Tauri build (smoke check)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing keys optional in CI — skip if not set
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ''
          releaseName: ''
          releaseDraft: true
          prerelease: true
          args: -- --locked

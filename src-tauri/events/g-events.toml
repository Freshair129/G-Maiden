# แก้ชื่อ/คำอธิบายและค่า value ในช่วง min..max ได้ที่ไฟล์นี้ แล้ว regenerate JSON และ rebuild
# ห้ามเปลี่ยน logic ด้วย detector; การเพิ่ม id ต้อง bump taxonomy version และเพิ่ม snapshot ใหม่
# Regenerate (from src-tauri, with the required owned Cargo lane/environment):
# cargo test --lib --offline --locked voice_api::tests::taxonomy::regenerate_events_json -- --ignored --exact
# This is metadata and bounded tuning, not a rule engine. Rust owns detection logic.
# Build.rs writes only OUT_DIR/events_gen.rs; JSON is written only by the command above.
# voice_rank is announcer single-slot arbitration, NOT audio::Priority or JSON priority.
# JSON uses TOML event order, label.en, category, priority, status and trigger verbatim.
# notes and runtime/deck metadata stay in TOML; they are not emitted into JSON.
# Pending requires since > Rust's RUNTIME_DETECTS_VERSION (currently 1.1), with voice_rank = 0.
# It registers an id but adds no detector; generated NON_FIRING_EVENTS lists it explicitly.
# deck_order/deck_label preserve the legacy EventDef UI independently of JSON.
# Pending and authoring-only events have no deck fields and do not appear in EventDef.
# Do not edit old id-history.json snapshots; append one after an intentional version bump.

[taxonomy]
version = "1.2"

[params.announcer]
multikill_window_s = { value = 18, min = 5, max = 60 }
hp_low_percent = { value = 20, min = 5, max = 50 }
mana_low_percent = { value = 15, min = 5, max = 50 }
level_up_milestones = [6, 12, 18, 25]


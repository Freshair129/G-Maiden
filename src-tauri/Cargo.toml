[package]
name = "g-maiden"
version = "0.1.0"
edition = "2021"
description = "G-Maiden Rust core — Dota 2 AI companion (latency-critical path)"

[[bin]]
name = "g-maiden"
path = "src/main.rs"

[dependencies]
tauri      = { version = "2.0", features = ["tray-icon"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
axum       = "0.7"
tauri-plugin-global-shortcut = "2"
windows-capture = "2.0"
tract-onnx = "0.21"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

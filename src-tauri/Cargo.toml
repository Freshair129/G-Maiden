[package]
name = "g-maiden"
version = "0.13.4"
edition = "2021"
description = "G-Maiden Rust core — Dota 2 AI companion (latency-critical path)"

[lib]
name = "g_maiden"
path = "src/lib.rs"

[[bin]]
name = "g-maiden"
path = "src/main.rs"

[dependencies]
tauri      = { version = "2.0", features = ["tray-icon"] }
webview2-com = "=0.39.1"
webview2-core = { package = "windows-core", version = "=0.62.2" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tokio      = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
axum       = "0.7"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = { version = "=2.10.1", path = "vendor/tauri-plugin-updater" }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
reqwest = { version = "0.13", features = ["blocking"] }
base64 = "0.22"
ring = "0.17"
windows-capture = { version = "2.0", optional = true }
windows = { version = "0.61", features = [
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_Globalization",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
] }
tract-onnx = "0.21"
rodio      = "0.19"
image      = "0.25"
# PP-OCRv5 inference on top of the tract-onnx we already use for minimap CV.
# Models ship out-of-band (tools/ocr-download/ — too large for git): on first
# use the engine looks under models/ocr/ next to the exe. See src/ocr.rs.
pure-onnx-ocr-sync = "0.2"
geo-types          = "0.7"
# In-process, zip-slip-safe archive extraction for imported voice packs
# (voice_api.rs import_archive) — `zip` is already pulled in transitively via
# tauri-plugin-updater (same major version), so this just makes it an
# explicit, minimally-featured direct dependency instead of a shell-out to
# PowerShell Expand-Archive. `deflate` is the only codec real-world .zip
# packs need (Explorer/7-Zip/Compress-Archive all default to it).
zip = { version = "4", default-features = false, features = ["deflate"] }

[features]
# Legacy WGC capture backend (ADR-13 rollback). Default build uses DXGI Desktop
# Duplication; `--features wgc` re-enables windows-capture + src/capture_wgc.rs.
wgc = ["dep:windows-capture"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

# Local in-game candidates retain debug assertions/authoring but should not pay
# the measured resident-code and CPU cost of an unoptimized application crate.
[profile.dev.package.g-maiden]
opt-level = 2

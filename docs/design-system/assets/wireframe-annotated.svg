<svg viewBox="-30 -30 1340 800" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <radialGradient id="amb2" cx="76%" cy="14%" r="55%">
      <stop offset="0" stop-color="#3a5ca8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06070A" stop-opacity="0"/>
    </radialGradient>
    <style>
      .z  { fill:#8fd4ff10; stroke:#8fd4ff55; stroke-width:1; }
      .zl { fill:#eef4fb; font-size:13px; font-weight:700; }
      .dm { fill:#f43f5e; font-size:11px; font-family:Consolas,monospace; }
      .tag{ fill:#a3e635; font-size:12px; font-weight:800; }
      .sub{ fill:#8ba4c6; font-size:10px; }
      .fab{ fill:#0e121c99; stroke:#a3e635; stroke-width:1; }
    </style>
  </defs>

  <rect x="-30" y="-30" width="1340" height="800" fill="#06070A"/>
  <rect x="-30" y="-30" width="1340" height="800" fill="url(#amb2)"/>

  <!-- panel -->
  <path d="M 40,12 H 800 A 20 20 0 0 1 820,32 V 54 A 20 20 0 0 0 840,74 H 1248 A 20 20 0 0 1 1268,94 V 410 A 20 20 0 0 1 1248,430 H 764 A 20 20 0 0 0 744,450 V 688 A 20 20 0 0 1 724,708 H 112 A 20 20 0 0 1 92,688 V 350 A 20 20 0 0 0 72,330 H 32 A 20 20 0 0 1 12,310 V 40 A 28 28 0 0 1 40,12 Z"
        fill="#0e1626" fill-opacity="0.55" stroke="#96c8ff33" stroke-width="1"/>

  <!-- ===== zones inside panel ===== -->
  <!-- anchor rail -->
  <rect class="z" x="16" y="22" width="70" height="300" rx="8"/>
  <text class="tag" x="34" y="52">P1</text>
  <text class="tag" x="34" y="80" fill="#6b8bb5">P2</text>
  <text class="tag" x="34" y="108" fill="#6b8bb5">P3</text>
  <text class="tag" x="34" y="136" fill="#6b8bb5">P4</text>
  <text class="tag" x="34" y="164" fill="#6b8bb5">P5</text>
  <text class="sub" x="20" y="340">anchor rail</text>
  <text class="dm" x="20" y="-6">100px</text>
  <line x1="16" y1="-2" x2="86" y2="-2" stroke="#f43f5e" stroke-width="0.8"/>

  <!-- score header -->
  <rect class="z" x="104" y="18" width="690" height="50" rx="9"/>
  <text class="zl" x="120" y="48">Score header</text>
  <text class="dm" x="700" y="48">690×50</text>

  <!-- stats bar -->
  <rect class="z" x="104" y="76" width="700" height="42" rx="9"/>
  <text class="zl" x="120" y="102">Stats bar — NW·GPM·XPM·KDA·CS/DN·PING</text>
  <text class="dm" x="700" y="102">700×42</text>

  <!-- battle -->
  <rect class="z" x="104" y="128" width="178" height="290" rx="9"/>
  <text class="zl" x="120" y="150">Slot 1–5</text>
  <text class="dm" x="120" y="405">178</text>
  <rect class="z" x="292" y="128" width="342" height="290" rx="12"/>
  <text class="zl" x="420" y="270">MINIMAP</text>
  <text class="tag" x="308" y="150">7</text>
  <text class="dm" x="420" y="405">1fr</text>
  <rect class="z" x="644" y="128" width="160" height="290" rx="9"/>
  <text class="zl" x="656" y="150">Slot 6–10</text>
  <text class="sub" x="300" y="440">Battle zone 700×290 · grid 178 | 1fr | 178 · gap 10</text>

  <!-- agent card -->
  <rect class="z" x="848" y="92" width="404" height="326" rx="14" fill="#8fd4ff18" stroke="#8fd4ff88"/>
  <text class="zl" x="866" y="120">Agent card (B)</text>
  <text class="tag" x="866" y="142" font-size="16">G-MAIDEN</text>
  <rect x="866" y="156" width="368" height="150" rx="10" fill="#131b30" stroke="#8fd4ff33"/>
  <text class="sub" x="1050" y="236" text-anchor="middle">CHARACTER ART</text>
  <text class="dm" x="1234" y="404" text-anchor="end">404×326</text>

  <!-- sector C -->
  <rect class="z" x="104" y="430" width="624" height="266" rx="11"/>
  <text class="tag" x="120" y="456">C</text>
  <text class="zl" x="140" y="456">Activity / Event Log</text>
  <line x1="416" y1="466" x2="416" y2="686" stroke="#8fd4ff22" stroke-dasharray="4 4"/>
  <text class="sub" x="220" y="580">ACTIVITY</text>
  <text class="sub" x="520" y="580">EVENTS</text>
  <text class="dm" x="712" y="686" text-anchor="end">624×266</text>

  <!-- ===== FABs (in cutouts) ===== -->
  <rect class="fab" x="836" y="12" width="432" height="50" rx="14"/>
  <text class="tag" x="1052" y="42" text-anchor="middle">Topbar FAB · 432×50</text>

  <rect class="fab" x="14" y="342" width="64" height="306" rx="16"/>
  <text class="tag" x="46" y="500" text-anchor="middle" transform="rotate(-90,46,500)">Sidebar · 64×306</text>
  <rect class="fab" x="14" y="656" width="64" height="44" rx="14" stroke="#f43f5e"/>
  <text x="46" y="683" fill="#f43f5e" font-size="14" text-anchor="middle">✕</text>

  <!-- signals -->
  <rect class="fab" x="756" y="442" width="250" height="121" rx="16"/>
  <text class="tag" x="772" y="466">D</text><text class="sub" x="788" y="466">Enemy Missing</text>
  <rect x="756" y="442" width="250" height="121" rx="16" fill="none"/>
  <rect class="fab" x="1018" y="442" width="250" height="121" rx="16" fill="#a3e63533" stroke="#a3e635"/>
  <text class="tag" x="1034" y="466">E</text><text class="sub" x="1050" y="466" fill="#0c1206">Gank Risk (hero)</text>
  <rect class="fab" x="756" y="575" width="250" height="121" rx="16"/>
  <text class="tag" x="772" y="599">F</text><text class="sub" x="788" y="599">Safe Push</text>
  <rect class="fab" x="1018" y="575" width="250" height="121" rx="16"/>
  <text class="tag" x="1034" y="599">G</text><text class="sub" x="1050" y="599">Vision</text>
  <text class="dm" x="1268" y="716" text-anchor="end">signals 512×254 · 2×2 · gap 12</text>

  <!-- canvas dim -->
  <text class="dm" x="620" y="748" text-anchor="middle">design canvas 1280 × 720 (16:9) — every coordinate is px in this system</text>
</svg>

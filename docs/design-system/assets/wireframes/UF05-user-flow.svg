yline points="1190,678 1190,736" fill="none" stroke="#91a9bd" stroke-width="1.7" marker-end="url(#uf-arrow)"/><polyline points="1190,846 1190,862 1388,862 1388,416 710,416 710,436" fill="none" stroke="#91a9bd" stroke-width="1.7" marker-end="url(#uf-arrow)"/><text x="1049" y="410" text-anchor="middle" font-size="13" fill="#cbd9e4" paint-order="stroke" stroke="#0b1016" stroke-width="5" stroke-linejoin="round">ลองใหม่</text><polyline points="1190,846 1190,862 32,862 32,266 230,266 230,286" fill="none" stroke="#91a9bd" stroke-width="1.7" marker-end="url(#uf-arrow)"/><text x="131" y="260" text-anchor="middle" font-size="13" fill="#cbd9e4" paint-order="stroke" stroke="#0b1016" stroke-width="5" stroke-linejoin="round">กลับ local</text><polyline points="710,828 710,886" fill="none" stroke="#91a9bd" stroke-width="1.7" marker-end="url(#uf-arrow)"/><polyline points="710,996 710,1012 230,1012 230,1036" fill="none" stroke="#91a9bd" stroke-width="1.7" marker-end="url(#uf-arrow)"/><text x="470" y="1004" text-anchor="middle" font-size="13" fill="#cbd9e4" paint-order="stroke" stroke="#0b1016" stroke-width="5" stroke-linejoin="round">เชื่อม</text><polyline points="710,996 710,1012 1190,1012 1190,1036" fill="none" stroke="#91a9bd" stroke-width="1.7" marker-end="url(#uf-arrow)"/><text x="950" y="1004" text-anchor="middle" font-size="13" fill="#cbd9e4" paint-order="stroke" stroke="#0b1016" stroke-width="5" stroke-linejoin="round">ยังไม่เชื่อม</text><a href="#account/account/signedout" data-destination="account/account/signedout" aria-label="เปิดหน้าบัญชี · P06"><rect x="560" y="136" width="300" height="92" rx="36" fill="#14212c" stroke="#96d9c3"/><text x="710" y="164" text-anchor="middle" font-size="16" fill="#e6edf3" >เปิดหน้าบัญชี</text><text x="710" y="187" text-anchor="middle" font-size="13" fill="#b0c0ce" >จากเมนูหรือโปรไฟล์</text><text x="844" y="218" text-anchor="end" font-size="10" fill="#a9dfff" >P06</text></a><g data-user-node="want"><path d="M710 286 L860 341 L710 396 L560 34
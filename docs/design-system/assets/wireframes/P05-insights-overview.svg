t-anchor="middle">ประวัติ</text></a><rect x="116" y="86" width="1148" height="64" rx="10" fill="#101820" stroke="#526170"/><text x="128" y="109" font-size="16" fill="#e6edf3" >P-HEAD · P05 · Insights</text><text x="130" y="137" font-size="14" fill="#b0bdc9" >ประวัติและสรุปในเครื่อง · บอกความครบของข้อมูล</text><rect x="116" y="198" width="1148" height="100" rx="10" fill="#101820" stroke="#526170"/><text x="128" y="221" font-size="16" fill="#e6edf3" >N1 · ภาพรวมและความครบของข้อมูล</text><text x="130" y="249" font-size="14" fill="#b0bdc9" >ยังไม่มีเซสชันในเครื่อง</text><text x="130" y="270" font-size="14" fill="#b0bdc9" >Metric ที่ไม่มีแหล่งข้อมูลใช้ — · ระบุจำนวนเซสชันและช่วงเวลา</text><rect x="116" y="314" width="754" height="338" rx="10" fill="#101820" stroke="#526170"/><text x="128" y="337" font-size="16" fill="#e6edf3" >N2 · สรุปและรายงานรายสัปดาห์</text><text x="130" y="365" font-size="14" fill="#b0bdc9" >สรุปไม่เกิน 3 ข้อ / complete session พร้อมเวลา</text><text x="130" y="386" font-size="14" fill="#b0bdc9" >ไม่เดา death cause หรือเติมช่วงเวลาที่หาย</text><text x="130" y="407" font-size="14" fill="#b0bdc9" >Local history ใช้ได้โดยไม่ต้องเข้าบัญชี</text><text x="130" y="428" font-size="14" fill="#b0bdc9" >OpenDota เป็นส่วนเพิ่มและต้องบอกแหล่งข้อมูล</text><a href="#insights/history/empty" data-destination="insights/history/empty" data-action="N-HISTORY" aria-label="ดูประวัติ"><rect x="128" y="610" width="100" height="28" rx="6" fill="#203345" stroke="#a9dfff"/><text x="178" y="629" font-size="13" fill="#e6edf3" text-anchor="middle">ดูประวัติ</text></a><rect x="886" y="314" width="378" height="338" rx="10" fill="#101820" stroke="#526170"/><text x="898" y="337" font-size="16" fill="#e6edf3" >N3 · โปรไฟล์สาธารณะ</text><text x="900" y="365" font-size="14" fill="#b0bdc9" >Steam / OpenDota: ไม่ได้เชื่อมต่อ</text><text x="900" y="386" font-size="14" fill="#b0bdc9" >แสดง unavailable เมื่ออ่านไม่ได้</text><text x="900" y="407" font-size="14" fill="#b0bdc9" >ไม่ใช้ข้อมูลสาธ
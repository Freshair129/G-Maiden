# =============================================================================
# G-Maiden Deck — Grid Layout SSOT  (canvas = real deck stage 1420x760)
# Edit here or in docs/design-system/deck-grid.html (Load / Export round-trips).
# RULES: round sizes (mult of 20/40, no 3-8 remainders), gaps 16 outer / 8 inner
# (D/E/F/G only). Content bbox 1232x696 <= shell 1256 → shell FITS BY SHRINKING.
# =============================================================================
canvas:
  width: 1420
  height: 760
  margin: 16
unit: 40
gap:
  outer: 16
  inner: 8
layers:  # bottom -> top (stacking order)
  - id: content
    name: "Content"
    visible: true
    locked: false
  - id: fab
    name: "FAB / Overlay (shell-pinned)"
    visible: true
    locked: false
zones:
  - id: Z2
    label: "Z2"
    layer: content
    x: 94
    y: 24
    w: 80
    h: 320
  - id: sidebar
    label: "SIDEBAR / NAVBAR (nav rail)"
    layer: fab
    x: 94
    y: 360
    w: 80
    h: 260
  - id: Z1
    label: "Z1"
    layer: content
    x: 94
    y: 636
    w: 80
    h: 80
  - id: A
    label: "A - MAIN (score / stats / hero grid)"
    layer: content
    x: 190
    y: 24
    w: 720
    h: 520

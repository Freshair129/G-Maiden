  # --- FR (§4). External-interface requirements extracted from the SRS ---
  #
  # G3.5-T2 (2026-07-20). NOTE ON REVIEW FINDING 1b: that finding states the
  # bootstrap produced "48 feature + 6 nfr rows and zero fr rows". That premise
  # is FALSE against this file. At the time of this task the manifest already
  # carried 12 `fr` rows (fr-3.1 .. fr-3.12, `source: fr-backfill 2026-07-20`),
  # one per SRS §3.x — verified with
  #   git show HEAD:docs/feature-ledger.manifest.yaml | grep -c 'kind: fr'  -> 12
  # So the FR group was NOT absent; finding 1b was written against an older
  # state and is already closed for §3. No §3 rows were added or duplicated
  # here: adding clause-level rows beside the existing section-level ones would
  # double-count the same requirement in every by-kind and drift total, which
  # is exactly the integrity property this ledger exists to protect.
  #
  # What WAS a real gap: SRS §4 (External Interface Requirements) had no `fr`
  # row at all, despite §4.1/§4.2 being genuine functional requirements — only
  # §5 is non-functional. The 7 rows below close that gap. Each is a literal
  # bullet from §4.1 / §4.2 of
  # docs/product/software-requirements-specification.md; `refs.srs` cites the
  # section and the id mirrors the SRS numbering.
  #
  # GRANULARITY (deliberate, not accidental): §3 is recorded per-section by the
  # earlier backfill; §4 is recorded per-clause because its bullets genuinely
  # diverge — §4.2's GSI interface ships today while its Gemini interface is
  # explicitly unwired, and a single rolled-up §4.2 row would hide that.
  #
  # refs.code/tests/review are EMPTY on every row: mapping an SRS interface

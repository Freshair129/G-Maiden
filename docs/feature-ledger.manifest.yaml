# docs/feature-ledger.manifest.yaml
#
# Hand-editable feature ledger manifest (G3 epic). This is the ONE
# hand-editable artifact in the pipeline — docs/FEATURE-LEDGER.md and the
# `ledger` block inside docs/DOC-GRAPH.json are GENERATED from this file by
# tools/doc-graph/ledger.mjs (G3-T3) and must never be hand-edited.
#
# Bootstrap-extraction (G3-T2, 2026-07-20): every entry below was extracted
# mechanically from PROJECT_FEATURE_MAP.md (sections 1-3: backend modules,
# frontend pages/features, product-level planned) and docs/features/FEAT-G-*.md
# headers, exactly as those two source docs stood at the time of extraction
# (PROJECT_FEATURE_MAP.md snapshot v0.13.0, 2026-07-19). Every entry carries
# `source: bootstrap-extraction` so a human can find and prune/refine these
# rows before the ledger is treated as authoritative. No test/review refs were
# invented — `refs.tests`/`refs.review` are left as empty arrays throughout;
# populate them by hand once real test/review evidence is identified.
#
# claimed_status derivation (PROJECT_FEATURE_MAP badge -> claimed_status),
# per the G3-T2 task spec:
#   SHIPPED -> code+tests-present   PARTIAL -> in-code
#   STUB    -> in-code              PLANNED -> doc-only
#
# PRUNE PASS (2026-07-20, Boss-delegated): every row now carries
# `source: bootstrap-extraction, pruned 2026-07-20`. Real test evidence was
# inventoried (cargo `#[cfg(test)]` mods grep-verified per module; frontend
# vitest files read for actual imports) and mapped into refs.tests
# (`cargo:<module>::tests::` command refs / test file paths); refs.review maps
# only documents that genuinely review that feature (audits/SEC-001/RCAs/
# CR-001-REVIEW). Where no honest evidence exists the CLAIM was lowered to
# match reality (never padded) — so the ledger now runs with 0 violations and
# any future drift is a real regression signal, not bootstrap noise.
#
# phase_target derivation:
#   - Where the row has a matching docs/features/FEAT-G-*.md doc with an
#     explicit `**Phase:** N` (or `N-M`) header line, that number is used
#     (first number of a range), clamped into the P0-P6 schema range (a doc
#     phase of 7 or 8 clamps to P6 — the schema's ceiling, not a claim that
#     the roadmap itself stops at 6).
#   - Where no FEAT doc / no explicit phase exists (most of PROJECT_FEATURE_MAP
#     §1.2/§1.4/§2.1/§2.2, which are status-badged but not phase-numbered),
#     phase_target is a bootstrap heuristic derived from the same badge:
#     SHIPPED -> P6, PARTIAL -> P5, STUB -> P3, PLANNED -> P1. This is an
#     assumption, not a sourced fact — a human should replace it with the
#     real roadmap phase during pruning.
#   - The 6 NFR rows (section 4) are ongoing enforced constraints rather than
#     a single dev-phase deliverable; phase_target: P6 there means "already
#     in force for the shipped product", not "planned for phase 6".
#
# refs.docs entries point at the FEAT doc's real repo path (not a bare slug)
# so they are directly resolvable by resolveRefs()'s existsSync check.
# refs.code entries are plain repo-relative file paths (no #Lxx line anchor —
# ledger-manifest.mjs's resolveRefs() does not strip anchors before checking
# existence, so a path+anchor would falsely resolve as "missing").

